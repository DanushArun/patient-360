# SAARTHI theme.
#
# Spec: planning/research/design/DESIGN-SYSTEM.md. Tokens mirror frontend/core/design.py -
# if you change one, change both. Colours here are the ones Streamlit's own chrome uses;
# design.py owns everything we draw ourselves.
#
# NOT the Snowflake brand theme. This is a clinical record tool, and #29B5E8 on white is
# 2.4:1 - it cannot legally carry text. The palette below was computed, not chosen.
#
# Fonts are bundled as files in static/ because Streamlit-in-Snowflake blocks remote URL
# fetches - a Google Fonts link silently falls back to a system font in SiS.
# fontFaces changes need a redeploy to take effect, not just a rerun.

[server]
enableStaticServing = true

[theme]
base = "light"

# --- colour (see design.py for measured contrast ratios) ---
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F6F7F8"   # evidence margin
textColor = "#1A1D21"                  # 16.91:1
primaryColor = "#1A5C8A"               #  7.14:1 - patient-evidence edge, also the focus ring
linkColor = "#1A5C8A"
borderColor = "#D8DCDF"                # decorative hairline only
linkUnderline = true                   # never rely on colour alone to mark a link (WCAG 1.4.1)

# --- type: Apple's macOS scale at 1pt = 4/3px. Body 13pt -> 17px. ---
font = "Inter"
codeFont = "JetBrainsMono"
baseFontSize = 17
baseFontWeight = 400
codeFontSize = "13px"
codeBackgroundColor = "#F6F7F8"
codeTextColor = "#4A5157"

# macOS Large Title 26 / Title1 22 / Title2 17 / Title3 15 / Headline 13 / Body 13, x4/3.
# Floor is 13px = Apple's macOS 10pt minimum.
headingFontSizes = ["34px", "29px", "23px", "20px", "17px", "13px"]
headingFontWeights = [400, 500, 500, 500, 600, 600]

# Restraint: no widget borders or shadows by default. A border implies interactivity,
# and most of this interface is text to be read, not controls to be operated.
showWidgetBorder = false
showSidebarBorder = true
baseRadius = "6px"
buttonRadius = "6px"

[theme.sidebar]
backgroundColor = "#F6F7F8"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#1A1D21"
borderColor = "#D8DCDF"

# --- bundled fonts (SiS cannot fetch remote fonts) ---
[[theme.fontFaces]]
family = "Inter"
url = "app/static/Inter-Regular.ttf"
weight = 400

[[theme.fontFaces]]
family = "Inter"
url = "app/static/Inter-Medium.ttf"
weight = 500

[[theme.fontFaces]]
family = "Inter"
url = "app/static/Inter-SemiBold.ttf"
weight = 600

[[theme.fontFaces]]
family = "Inter"
url = "app/static/Inter-Bold.ttf"
weight = 700

[[theme.fontFaces]]
family = "JetBrainsMono"
url = "app/static/JetBrainsMono-Regular.ttf"
weight = 400

[[theme.fontFaces]]
family = "JetBrainsMono"
url = "app/static/JetBrainsMono-Medium.ttf"
weight = 500
