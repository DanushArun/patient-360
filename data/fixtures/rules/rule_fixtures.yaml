# Rule fixtures - SAARTHI regression corpus
# ==========================================
# Per SPEC.md §14 line 851: "16 rules x 5 cases (pass, fail, exact-boundary,
# missing-input, conflicting-input) = 80 SQL assertions. Doubles as CoCo
# Testing-phase evidence."
#
# Each fixture is a named test scenario for evaluate_gates. The "inputs" section
# describes what facts must be seeded before invoking the rule; "expected" is
# what evaluate_gates should return.
#
# HOW TO USE
#   A future backend/scripts/run_rule_fixtures.py will:
#     1. For each fixture: seed the described inputs into a scratch schema
#     2. CALL SAARTHI.OPERATIONAL.EVALUATE_GATES(patient_id, rule_id_filter)
#     3. Assert outcome == expected.outcome AND expected_reason regex matches
#     4. Emit machine-readable results (JSONL, one row per fixture)
#   Not yet built. This file is the corpus; the runner is a Danush-territory
#   item (touches evaluate_gates test wiring).
#
# GAP NOTE - 3 of the 16 rules have current implementation gaps flagged in
# the implementation status ledger:
#   gap 6: ENDO-DEXA-001 threshold shape not implemented (returns not_evaluated
#          when it should return pass/fail based on T-score)
#   gap 7: LVEF and HbA1c events not emitted by ledger.py (so SURV-LVEF-*,
#          ENDO-HBA1C-001 fixtures cannot run against generated data until
#          the ledger emits them or fixtures self-seed)
#   The fixtures below are still authored as if the gaps were closed - they
#   describe the CORRECT expected behaviour once the underlying gate/generator
#   is complete. Running them against the current build should surface exactly
#   the gap-6 and gap-7 failures.

version: 1
last_updated: 2026-09-22
rules_count: 16
scenarios_per_rule: 5
total_fixtures: 80

# =============================================================================
# 1. CLIN-ANC-001  -  Absolute Neutrophil Count for chemotherapy readiness
# =============================================================================
# Threshold: ANC >= 1500/uL within 7 days of chemo cycle start.
# ANC may be reported directly OR derived from WBC * (neutrophil% + band%) / 100.

CLIN-ANC-001:
  - id: CLIN-ANC-001__pass
    scenario: pass
    inputs: {anc: 2100, source_recorded_at: "T-3d"}
    expected: {outcome: pass, reason_regex: "ANC.*(2100|>=.*1500)"}
  - id: CLIN-ANC-001__fail
    scenario: fail
    inputs: {anc: 900, source_recorded_at: "T-2d"}
    expected: {outcome: fail, reason_regex: "ANC.*(900|<.*1500)"}
  - id: CLIN-ANC-001__boundary
    scenario: exact-boundary
    inputs: {anc: 1500, source_recorded_at: "T-1d"}
    expected: {outcome: pass, reason_regex: "ANC.*1500"}
  - id: CLIN-ANC-001__missing
    scenario: missing-input
    inputs: {anc: null}
    expected: {outcome: not_evaluated, reason_regex: "(not_received|missing|no.*ANC)"}
  - id: CLIN-ANC-001__conflicting
    scenario: conflicting-input
    inputs: {sources: [{anc: 1600, from: FAC-01, at: "T-2d"}, {anc: 900, from: FAC-02, at: "T-2d"}]}
    expected: {outcome: conflicting, reason_regex: "conflict|disagree"}

