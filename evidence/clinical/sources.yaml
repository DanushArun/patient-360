# Every document the clinical-completeness ledger (requirements.yaml) quotes.
#
# The verifier (backend/scripts/verify_clinical_proof.py) downloads each `url`
# source into evidence/clinical/.cache/ (git-ignored) and checks it against
# `sha256`. A changed hash means the publisher revised the document: the
# verifier still checks every quote, but flags the source for re-review.
#
# Layers - why these are the whole question:
#   regimen         what the treating protocol requires before each cycle
#   drug            what the drug's own regulatory document requires
#   administration  what the chair-side nursing check requires
#   payer           what the scheme requires before it will pay
#   guideline       what Indian national guidance adds on top
# Every pre-cycle check comes from one of these places. Evidence that a
# clinician gathers by examining the patient on the day is Class A and
# out of scope by design (AGENTS.md section 5).
#
# Why BC Cancer for the regimen layer: it publishes one protocol per regimen
# with a fixed "TESTS - before each treatment" section and numeric
# dose-modification tables, freely downloadable and dated. It is Canadian
# provincial guidance, not Indian guidance. Where the National Cancer Grid or
# Tata Memorial publish an equivalent regimen protocol, add it here and the
# verifier will compare both.

