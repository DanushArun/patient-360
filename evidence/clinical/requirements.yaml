    path: per_regimen_min_crcl.PEM-CARBO
    kind: min
    source_value: 45
    unit: mL/min
    label: creatinine clearance for pemetrexed
  implementation:
    verdict: fixed
    file: backend/sql/procedures/evaluate_gates.sql
    lines: 373-402
    finding: 'Fixed 24 Sept (CLIN-*-001 v2): the evaluator now applies the patient''s regimen threshold and a 7-day
      freshness limit. Before: The rule''s JSON (45) matches the protocol, but the evaluator passes anyone at 30
