# What we deliberately did NOT do

principles_upheld:
  - No commit created by CoCo. AGENTS.md §1 - Danush handles all commits.
  - No file in Danush's generator territory edited (ledger.py, corruptions.py,
    projections.py, fhir_bundles.py). Gaps logged for his review.
  - No new tables, rules, or features beyond what SPEC.md names. Every change
    completes something SPEC already described.
  - Every code change has a verified_on: entry - JN89282 execution, not desk-check.
  - Runtime-order-vs-declared-order and 1%-tolerance calibration decisions logged
    in REMAINING-WORK.md §6 design considerations - judgment calls surface for
    team review, never buried inline.
