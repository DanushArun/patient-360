phase: development
status: in_progress
window: 2026-09-18 - ongoing
principle: >
  Development runs as small focused sessions - one problem, one file, one verification.
  Every code change carries a session ID and a live-tested outcome. Failures are
  recorded alongside fixes in the same session.

