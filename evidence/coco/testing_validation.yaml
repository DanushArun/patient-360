# =============================================================================
# What "PASS" means in this file
# =============================================================================
# - Every "verified" claim above cites either a query_id, a script + result,
#   or a file + section reference.
# - Failures are named alongside their fixes. Nothing is curated out.
# - The engineering gates verified here are NOT clinical validation. No rule
#   has been validated against real patient outcomes (AGENTS.md #4 +
#   IMPLEMENTATION-STATUS.md §10).
# - AGENTS.md #4 is met: judges spend 5-22 Oct alone with this repo and can
#   reproduce every stage above from the repository plus one Snowflake trial
#   account.
