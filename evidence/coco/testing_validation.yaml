# CoCo Lifecycle Evidence - Phase 4: TESTING AND VALIDATION
# Hackathon requirement: "Use CoCo to write tests, validate results, and record
# what worked, what failed, and what was fixed - not curated to look clean."
#
# Verify any session: cortex conversations transcript <id>
# Verify any query:   SELECT * FROM SNOWFLAKE.ACCOUNT_USAGE.QUERY_HISTORY WHERE QUERY_ID = '<qid>'
#                     (up to 180 min lag in ACCOUNT_USAGE per AGENTS.md #4)

phase: testing_validation
status: in_progress
window: 2026-09-17 - ongoing
account: JN89282 (region GCP_ME_CENTRAL2)
principle: >
  Every test in this file is either (a) a live query against JN89282 with a
  QUERY_ID resolvable in ACCOUNT_USAGE, (b) a passing invocation of a script
  in the repository, or (c) a documented failure with the fix that closed
  it. Nothing in "verified" was asserted without a run. Failures are not
  curated out - they are the most credible lifecycle evidence available
  (AGENTS.md #4).

# =============================================================================
stages:

  - stage: 1_platform_behaviour_probes
    date: 2026-09-17
    what: >
      Ten platform behaviours empirically probed before any SPEC line was
      written. Each finding either decided a piece of the architecture or
      was retained as a live guard. Full query IDs and their exact SQL live
      in evidence/coco/verification-query-ids.md.
    principle: >
      The architecture is defended by what Snowflake actually does on this
      account, not by what a docs page says. F3 and F5 in particular would
      have gone undetected without live probes and would have shipped as
      silent security bypasses.
    verified_findings:
      - id: F1
        finding: "AGENT_RUN(VARCHAR), DATA_AGENT_RUN exist -> container runtime optional"
        decision: "warehouse runtime is acceptable; no compute pool required for the vertical slice"
      - id: F2
        finding: "row access policies filter strictly, including ACCOUNTADMIN with a primary role"
        decision: "RAP is a real boundary, not a hint - proceed to build patient_scope"
      - id: F3
        finding: "CURRENT_USER() survives owner's-rights elevation; CURRENT_ROLE() does not"
        decision: "architecture-deciding - every RAP MUST key on CURRENT_USER; role-keyed policies bypass silently"
      - id: F4
        finding: "Cortex Search cannot be created over a RAP-protected table"
        decision: "DOC_CHUNK is un-RAP'd (index, returns IDs); DOC_PAGE holds RAP-protected content; chunk_documents is a proc not a DT because search needs an un-RAP'd source"
      - id: F5
        finding: "Cortex Search ignores row access policies - returned another patient's text"
        decision: "architecture-deciding - never rely on RAP to scope search; owner's-rights procedures do the filtering"
      - id: F6
        finding: "@eq attribute filter works on Cortex Search"
        decision: "server-side patient scope in search tools via @eq(patient_id, :bound_patient)"
      - id: F7
        finding: "secondary roles defeat a USAGE-based control - a secondary ACCOUNTADMIN satisfies the check"
        decision: "every app session MUST run USE SECONDARY ROLES NONE, or authenticate as a dedicated service user granted only the app role"
      - id: F8
        finding: "AI_FILTER text form takes ONE argument (two-argument form is images only)"
        decision: "wrap prompts through PROMPT('...{0}', col) or CONCAT('...', col) - documented in AGENTS.md"
      - id: F9
        finding: "stages used by AI functions must be ENCRYPTION=(TYPE='SNOWFLAKE_SSE')"
        decision: "PATIENT_DOCS + REFERENCE_DOCS + SKILLS all declared SNOWFLAKE_SSE in stages DDL"
      - id: A1
        finding: >
          the agent derives patient_id from question text and injects the
          filter itself when given a raw cortex_search or cortex_analyst tool
        decision: >
          architecture-deciding - agents receive ONLY generic tools over
          owner's-rights procedures; every tool input_schema OMITS patient_id
          so it is unreachable by construction, not by instruction (R5 layer 2)

