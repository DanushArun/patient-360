# =============================================================================

  - stage: 5_failure_and_fix_pairs
    what: >
      The most credible lifecycle evidence. Curated failures are worthless;
      real failures with the fix that closed them are the record. Listed
      chronologically.
    principle: "AGENTS.md #4 - Record failures. Failure-and-fix pairs are the most credible lifecycle evidence available."
    pairs:

      - id: 1
        date: 2026-09-20
        title: "llama3.1-70b marked as R7 pass-B model was in the same family as llama3.3-70b"
        failure: >
          R7 two-pass extraction depends on TWO DIFFERENT MODEL FAMILIES to
          preserve cross-family independence. Initial pick was llama3.1-70b
          for pass B against llama3.3-70b for pass A. Turns out both are
          Meta Llama - same family, same failure modes. Independence guarantee
          did not exist.
        fix: >
          Moved pass B to claude-haiku-4-5. Fallbacks documented in AGENTS.md
          as mistral-large3 and qwen3-32b (NEVER a second Llama). Banned
          orchestration: auto for the same reason (re-selection breaks
          measured accuracy silently).
        surfaced_in: "AGENTS.md #8"

      - id: 2
        date: 2026-09-17
        title: "row access policy keyed on CURRENT_ROLE silently returned every patient"
        failure: >
          First patient_scope RAP was keyed on CURRENT_ROLE(). Inside an
          EXECUTE AS OWNER procedure, CURRENT_ROLE() becomes the owner's role
          while CURRENT_USER() stays the caller. Role-keyed policy returned
          every patient - a total bypass invisible in single-user testing.
        fix: >
          Rewrote the policy to key on CURRENT_USER(). F3 promoted to
          architecture-deciding platform finding and enforced in every RAP
          across the codebase.
        surfaced_in: "AGENTS.md #3.1"

      - id: 3
        date: 2026-09-22
        title: "parse_documents_proc scanned only PATIENT_DOCS, missed REFERENCE_DOCS entirely"
        failure: >
          Deploy of reference corpus Tier 1 landed WHO + NCD PDFs at
          @REFERENCE_DOCS. parse_documents_proc had one cursor over
          PATIENT_DOCS only - the reference stage was never scanned, 0 DOC_PAGE
          rows produced for reference docs, ASK_SAARTHI could not cite a
          guideline.
        fix: >
          Added a second cursor + WHILE loop with scope='reference',
          patient_id=NULL, doc_type='clinical_guideline'. chunk_documents_proc
          already read both scopes via d.scope, no change there. Landed 2
          DOCUMENT + 159 DOC_PAGE + 159 DOC_CHUNK for reference corpus.
        surfaced_in: "REMAINING-WORK.md §5 gap 9"

      - id: 4
        date: 2026-09-22
        title: "patient_scope RAP filtered ALL reference-scope docs invisibly"
        failure: >
          Original RAP required d.patient_id = ct.patient_id. Reference docs
          have patient_id=NULL, so every reference DOC_PAGE row was filtered
          out. chunk_documents_proc returned 0 chunks; the just-fixed parse
          from #3 had nothing downstream to work with. R6 was blocked without
          any error.
        fix: >
          Added top OR-branch to RAP that returns TRUE unconditionally for
          d.scope='reference'. Bottom branch (patient-scope, keyed on
          CURRENT_USER) unchanged. R5 layer 3 preserved for patient docs;
          reference corpus now functional per R6.
        surfaced_in: "REMAINING-WORK.md §5 gap 10"

      - id: 5
        date: 2026-09-22
        title: "DEXA rule returned not_evaluated even with a live T-score reading"
        failure: >
          ENDO-DEXA-001 had a T-score of -1.6 in the DB but returned
          not_evaluated because evaluate_gates only implemented simple-threshold
          shape and had no branch for the DEXA stratified banding required by
          NCCN v4.2024.
        fix: >
          Added stratified-band branch: 24-month interval for normal, 12-month
          for osteopenia (-2.5<T<-1.0), 6-month for osteoporosis. Also added
          freshness-only shape for SURV-LVEF-001/002. DEXA now returns pass
          with substantive reason.
        surfaced_in: "REMAINING-WORK.md §5 gap 6"

      - id: 6
        date: 2026-09-23
        title: "PRE_AUTHORIZATION duplicate table - I built one while Danush's richer AUTHORIZATION already existed"
        failure: >
          Third-pass work introduced backend/sql/tables/25_pre_authorization.sql
          with basic status columns. Cross-check on 23 Sept found Danush's
          20_core.sql already defined CORE.AUTHORIZATION with the richer
          schema needed for SPEC §247's flagship demo - denial_is_curable +
          partial/conflicting statuses. Both my file and Danush's own
          load_daycare_cohort.sql referenced PRE_AUTHORIZATION.
        fix: >
          Consolidated onto AUTHORIZATION per SPEC §239. Merged operational
          columns (patient_id, scheme, package_display, letter_status,
          decided_at, expires_at, reviewed_by) into it. Renamed responded_at
          -> decided_at, valid_until -> expires_at. Dropped 25_pre_authorization.sql.
          Files touched: 20_core.sql, load_synthetic.sql, load_daycare_cohort.sql,
          evaluate_gates.sql, run_rule_fixtures.py, setup.sql. Live-verified
          28/28 fixture tests still PASS.
        surfaced_in: "REMAINING-WORK.md §5 gap 20"

      - id: 7
        date: 2026-09-23
        title: "MCP server DDL rejected: 'spec is invalid: null'"
        failure: >
          First saarthi_mcp.sql attempt included security: and execute_as:
          keys in the YAML spec, taken from analogy with agent DDL. Snowflake
          parser rejected: 'Cannot create MCP server because spec is invalid:
          null'.
        fix: >
          Correct grammar per docs.snowflake.com/user-guide/snowflake-cortex/
          cortex-agents-mcp is tools: only, no security or execute_as. Rewrote
          spec to expose exactly one CORTEX_AGENT_RUN tool. Deployed cleanly.
          Grants added in 03_grants.sql (USAGE on server AND agent - server
          USAGE alone does not confer tool access per Snowflake docs).
        surfaced_in: "REMAINING-WORK.md §5 gap 19"

      - id: 8
        date: 2026-09-23
        title: "MCP PAT auth failed with HTTP 401 'Network policy is required'"
        failure: >
          First mcp_client.py health call from Daksha's laptop returned
          HTTP 401 code=390432. Snowflake requires a network policy on the
          user for PAT authentication - not documented in the MCP quickstart
          but a hard constraint in the auth path.
        fix: >
          Created SAARTHI_MCP_DEMO_POLICY with ALLOWED_IP_LIST=('0.0.0.0/0')
          - permissive-for-demo so any judge can reproduce. Attached to user
          DAKSHA via ALTER USER SET NETWORK_POLICY. Documented in
          docs/MCP-QUICKSTART.md and codified in 04_pat_provisioning.sql so
          the next operator does not re-hit the 401.
        surfaced_in: "docs/MCP-QUICKSTART.md step 1"

      - id: 9
        date: 2026-09-23
        title: "Agent hit 'Unknown user-defined function' calling its own tool"
        failure: >
          MCP call succeeded through the server + agent but the agent's first
          tool invocation (GetReadiness) returned 'SQL compilation error:
          Unknown user-defined function SAARTHI.OPERATIONAL.GET_READINESS'.
          Same for GetPatientFacts. Both procedures existed and were
          EXECUTE AS OWNER, so this was a visibility error - SAARTHI_MCP_CLIENT
          could not SEE the procedures despite server + agent USAGE.
        fix: >
          Added GRANT USAGE ON ALL PROCEDURES IN SCHEMA SAARTHI.OPERATIONAL
          TO ROLE SAARTHI_MCP_CLIENT (+ FUTURE PROCEDURES). EXECUTE AS OWNER
          means procedure bodies still run under ACCOUNTADMIN with full
          access; caller only needs the USAGE entry-key. Retested end-to-end:
          agent orchestrated the tool, returned honest no_patient_bound
          verbatim.
        surfaced_in: "REMAINING-WORK.md §5 gap 25"

