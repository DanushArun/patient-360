# Failure-and-fix pairs recorded during execution
# (Per AGENTS.md §4: "Failure-and-fix pairs are the most credible lifecycle
#  evidence available. Do not curate them out.")

failure_and_fix_pairs:

  - date: 2026-09-22
    finding: >
      llama3.1-70b is now [legacy], end-of-life pending. R7 pass B moved to
      claude-haiku-4-5. More importantly llama3.1-70b was never a different
      family from llama3.3-70b - the cross-family independence R7 rests on
      did not exist.
    fix: R7 pass B pinned to claude-haiku-4-5. AGENTS.md §3 #8 amended.
    session: earlier planning sessions (see planning.yaml)

  - date: 2026-09-22
    finding: >
      Row access policy on DOC_PAGE was keyed on CURRENT_ROLE() at some point
      during scaffolding. Inside EXECUTE AS OWNER procedures, CURRENT_ROLE()
      becomes the owner's role, so the policy returned every patient - total
      bypass invisible in single-user testing.
    fix: Policy re-keyed on CURRENT_USER(). Recorded as AGENTS.md §3 #1.

  - date: 2026-09-22
    finding: >
      parse_documents_proc only scanned PATIENT_DOCS. SPEC R6 requires two
      corpora but the reference path had no ingest. Symptoms: PUT-ing a
      guideline PDF to @REFERENCE_DOCS did nothing downstream.
    fix: >
      Added a second cursor to parse_documents_proc with scope='reference',
      patient_id=NULL, doc_type='clinical_guideline'. Verified 2 DOCUMENT +
      159 DOC_PAGE + 159 DOC_CHUNK produced on JN89282.
    gap_ref: REMAINING-WORK.md §5 gap 9
    session: 77ff4bce-f08f-47a5-92f8-5a2c7cbab753

  - date: 2026-09-22
    finding: >
      patient_scope RAP required d.patient_id = ct.patient_id, which cannot
      match rows where d.patient_id IS NULL (reference docs). Result: every
      reference DOC_PAGE row filtered out invisibly. chunk_documents_proc
      returned 0 chunks - silent zero-row bug found only when the search
      service reported empty index.
    fix: >
      ALTER ROW ACCESS POLICY patient_scope SET BODY to add top OR branch
      returning TRUE for d.scope='reference'; bottom patient-scope branch
      keyed on CURRENT_USER() unchanged. R5 Layer 3 preserved, R6 functional.
    gap_ref: REMAINING-WORK.md §5 gap 10
    session: 77ff4bce-f08f-47a5-92f8-5a2c7cbab753

  - date: 2026-09-22
    finding: >
      evaluate_gates doesn't implement DEXA T-score threshold shape.
      ENDO-DEXA-001 has evidence (EVT-DEXA, T-score = -1.6) but the gate
      returns not_evaluated with reason "evidence exists but this rule's
      threshold shape is not yet implemented by evaluate_gates". Rule row
      ships in RULE_CATALOG; the SQL comparator branch is missing.
    fix: Flagged to Danush - real bug in his procedure, not fixed on this branch.
    gap_ref: REMAINING-WORK.md §5 gap 6

  - date: 2026-09-22
    finding: >
      ledger.py doesn't emit LVEF or HbA1c events. Two of five readiness
      rules can therefore never be tested end-to-end from generated data.
    fix: Flagged to Danush - his generator territory, not fixed on this branch.
    gap_ref: REMAINING-WORK.md §5 gap 7

