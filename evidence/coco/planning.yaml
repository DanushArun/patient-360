      breakdown:
        SPEC-REVIEW: 21   # component correctness
        SCALE-REVIEW: 15  # multi-facility / pan-India shape
        DEEP-REVIEW-3: 14 # safety, federation, extensibility
      most_important: >
        The answer validator checked claim-to-evidence consistency but never
        evidence-to-reality consistency. A misread lab value passes all five original
        checks and produces a perfectly cited, clinically wrong answer. This produced
        rule R7 (two-pass extraction verification) and a sixth validator check.
      self_corrections:
        - >
          Initially recommended 20 rules across 5 departments. Grounding the decision in
          the confirmed rubric reversed it: Solution Completeness (30%) penalises
          untested breadth, and two of four competitors are already broad, so breadth is
          table stakes rather than differentiation. Revised to 16 rules.
        - >
          Discovered the existing 13 rules already spanned four organ systems and had
          been mislabelled as oncology. Adding a specialty column exposed that breadth
          at no authoring cost.
        - >
          Committed to 3 new non-oncology rules without sourced thresholds. A grep for
          hba1c|dexa|post-op across every clinical research file returned zero matches.
          Recorded as an open gap rather than silently written in.

