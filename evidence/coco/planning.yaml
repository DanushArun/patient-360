    key_findings:
      - >
        Cortex Search executes with owner's rights and does not respect row access
        policies. A RAP-only design for search scope is theatre. This invalidated part
        of the drafted architecture and forced the three-layer R5 design.
      - AI functions cannot run inside Dynamic Tables; AI steps must be Task-driven.
      - >
        India regions lack native AI_COMPLETE. CORTEX_ENABLED_CROSS_REGION must be set
        or nothing works.
      - >
        Recorded as MUST EMPIRICALLY TEST, because documentation does not answer it:
        whether an immutable session attribute constrains the Cortex Search tool inside
