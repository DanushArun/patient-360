    key_findings:
      - >
        DPDP Act 2023: erasure (s.12(3)) and access-log retention (Rule 6(e), 1 year)
        collide if generated answers are stored inline. ANSWER_RUN must hold pointers,
        never content. This is a schema constraint arising from law, and it had to be
        correct in the first migration.
      - >
        NMC Telemedicine Practice Guidelines 2020 prohibit AI/ML platforms from
        counselling or prescribing. The Class A / Class B question split is therefore a
        legal boundary, not a product preference.
      - >
        A missing medical record creates an adverse inference of negligence in Indian
        law. The audit trail is a legal requirement, not over-engineering.
      - >
        Indian labs report the same analyte in incompatible formats. Platelets written
        as "1.5" may mean 1.5 lakh/µL or 1.5 x 10^9/L — a 100,000x ambiguity.
      - >
        60-70% of the ~8% of Indian health insurance claims repudiated annually
        (approx ₹30,000 crore) fail for documentation or procedural reasons knowable
        before admission.

  - stage: 4_real_document_study
    date: 2026-09-16
    purpose: >
      Study 19 photographs of a real patient's medical reports to understand actual
      document formats and failure modes. Consent: the patient's son is a member of
      this team. No real patient data enters the system — the study informed format
      research only, and all system data is synthetic.
    outputs:
      - planning/research/patient-reality/real-patient-dipali.md
    key_findings:
      - 3 facilities, 7 distinct patient identifiers, zero ABHA present on any report.
      - >
        Grade discordance between specimens: outside biopsy read Grade II, hub surgical
        pathology read Grade III. Both correct for their own specimen. A system that
        silently takes the newer value is wrong.
      - >
        HER2 IHC discordance between labs: 1+ at one lab, 2+ at another. 1+ requires no
        FISH; 2+ requires it. Had only the first result existed, HER2 would have been
        recorded negative and treatment would have differed.
      - Haemoglobin appeared as "10.3 GM%", "10.7 L gm/dl", and "12.0 g/dL" across reports.
      - Reference ranges printed in Indian comma notation — "1,50,000 - 4,50,000".
      - L and H suffixes on values are flags, not units, and must not be parsed as digits.
      - >
        Treatment plan changed four times in 18 months. TREATMENT_PLAN must be a
        versioned entity, not a current-state column.
      - >
        An appendectomy mid-chemotherapy created a treatment gap that is a clinical
        complication, not a documentation failure. ENCOUNTER.gap_type exists because
        of this.
      - Several report photographs are rotated or fully inverted. This is the norm, not an edge case.

  - stage: 5_platform_research
    date: 2026-09-16
    purpose: Establish what Snowflake actually supports before designing against it.
    outputs:
