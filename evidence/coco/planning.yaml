      - >
        Judging is two-stage: async repository evaluation 5-22 Oct with the team absent,
        then live demo 27-30 Oct. This makes reproducibility and honest documentation
        more important than demo polish, because Stage 1 is what gets you to Stage 2.
      - >
        Rubric confirmed: Real-World Relevance 30%, Technical Execution 40%,
        Solution Completeness 30%.
      - >
        The brief explicitly invites "risk stratification". We had deliberately avoided
        the term. The explainer uses "risk stratification metrics" and "care gap
        indicators". Vocabulary adopted, with an explicit scope disclosure.
      - >
        Explainer instructs building separate skills per process and orchestrating them
        with a Task. We had planned one skill. Revised to four skills plus an
        orchestrating Task, which satisfies two named bonus categories at once.
      - >
        "Semi-structured" is named as a distinct data category. FHIR bundles are JSON,
        so one ingestion path satisfies it and closes the missing-ingestion gap.

