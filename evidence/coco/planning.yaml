failures_recorded:
  note: >
    Recorded deliberately. coco-lifecycle-evidence.md identifies failure-and-fix pairs
    as the most credible evidence available, and a curated record of only successes
    reads as a demo rather than an engineering process.
  items:
    - failure: >
        Four consecutive incorrect attempts at AI_FILTER syntax, assuming a two-argument
        (predicate, text) form.
      resolution: >
        Documentation showed the two-argument form is for image inputs only. The text
        form takes one argument. Both CONCAT and PROMPT forms then verified working.
      lesson: Stop guessing after the second failure and read the reference.

    - failure: >
        Designed Layer 1 of the security model as "the application role has no USAGE on
        the search service" and treated it as sufficient.
      resolution: >
        Testing showed the query succeeded anyway. CURRENT_SECONDARY_ROLES() returned
        ORGADMIN,ACCOUNTADMIN with value ALL — a secondary role satisfied the privilege
        check. USE SECONDARY ROLES NONE is now a hard architectural requirement.
      lesson: >
        The most dangerous security assumption is the one that appears to work.

    - failure: >
        Assumed a Cortex Search service could be created over a table protected by a
        row access policy.
      resolution: >
        Creation fails — change tracking is unsupported on queries with correlated
        subquery expressions, and the standard mapping-table RAP is one. The index and
        content must be separate objects. The platform enforces the design we had
        chosen for other reasons.
      lesson: Verify platform mechanics before relying on them.

    - failure: >
        Scheduled the entire build against a 30 September deadline recorded in plan.md.
      resolution: Event page confirms 4 October. Four days recovered.
      lesson: Verify dates from the primary source before planning against them.

